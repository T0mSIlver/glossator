# Local Vespa for development.
# Query API: http://localhost:${VESPA_QUERY_PORT:-18080}  (.env VESPA_QUERY_PORT)
# Config server: http://localhost:${VESPA_CONFIG_PORT:-19072}  (.env VESPA_CONFIG_PORT)
# Container name: ${VESPA_CONTAINER:-glossator-vespa}  (.env VESPA_CONTAINER); a second
# checkout on the same machine sets its own, and its own ports.

services:
  vespa:
    image: vespaengine/vespa:latest
    container_name: ${VESPA_CONTAINER:-glossator-vespa}
    hostname: ${VESPA_CONTAINER:-glossator-vespa}
    ports:
      - "${VESPA_QUERY_PORT:-18080}:8080"
      - "${VESPA_CONFIG_PORT:-19072}:19071"
    volumes:
      - vespa-data:/opt/vespa/var
    environment:
      # Vespa finds its config server by hostname, so both follow the container's.
      - VESPA_CONFIGSERVERS=${VESPA_CONTAINER:-glossator-vespa}
      - VESPA_HOSTNAME=${VESPA_CONTAINER:-glossator-vespa}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19071/state/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  vespa-data:
