# Cloudflare tunnel for the glossator MCP server.
#
# Copy to /etc/cloudflared/config.yml on the deployment host and replace
# <TUNNEL-ID> and <HOSTNAME>. The tunnel and its credentials file are created by
# hand; deploy/README.md has the commands in order.

tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

# Cloudflare terminates TLS, so the origin is plain HTTP on the loopback
# address the compose file publishes.
originRequest:
  connectTimeout: 30s
  # An `ask` call runs a generation behind the MCP request and can take a
  # minute; a shorter keep-alive drops the connection mid-answer.
  keepAliveTimeout: 300s

ingress:
  - hostname: <HOSTNAME>
    service: http://localhost:8000
  # Anything else that resolves to this tunnel is refused rather than routed.
  - service: http_status:404
