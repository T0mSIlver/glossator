[project]
name = "glossator"
version = "0.1.0"
description = "Grounded question answering over Mistral's documentation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=3.3.1",
    "httpx>=0.27",
    # Pinned exactly, and core and the vespa plugin are released in lockstep on the same version
    # number. The `vespa` extra pulls the plugin, whose own dependency on core carries no lower
    # bound -- so a core pin left behind a plugin release resolves to a pair that imports names
    # the older core does not have. Bump both by bumping this.
    "mistralai-search-toolkit[text-splitter-langchain,vespa]==0.0.13",
    "python-dotenv>=0.9.9",
    "pyyaml>=6.0.3",
    # Also a toolkit dependency, but called directly, so declared rather than inherited.
    "structlog>=25.1",
]

[project.optional-dependencies]
workflows = [
    "mistralai-workflows[mistralai]>=3.0.0,<4",
    "pydantic",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
exclude-newer = "7 days"
# Gemfury (UV_EXTRA_INDEX_URL) may list older versions of mistral-common /
# mistralai-search-toolkit than PyPI. Allow uv to pick the best match across indexes.
index-strategy = "unsafe-best-match"

[tool.uv.exclude-newer-package]
mistralai = false
"mistral-common" = false
"mistralai-search-toolkit" = false
"mistralai-search-toolkit-plugins-vespa" = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entrypoints", "src/glossator", "src/examples"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff also formats Python inside Markdown code fences, which would rewrite the vendored
# skill documentation and the corpus fixtures (their hashes are in a manifest), so the
# scope is stated as explicit Python paths. The workflow samples are template scaffolding.
include = ["src/glossator/**/*.py", "src/entrypoints/**/*.py", "tests/**/*.py"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # The toolkit's base classes declare `context: IngestContext = IngestContext()`; an
    # override must match that signature. The contexts are frozen models, so the
    # shared-mutable-default hazard the rule guards against does not apply.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Corpus fixtures reproduce upstream MDX and TypeScript lines verbatim; wrapping
# them would stop them from being the thing under test.
"tests/corpus/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# The workflow samples only type-check with the optional `workflows` extra installed
# and carry no annotations; everything else is checked strictly.
files = ["src/glossator", "src/entrypoints", "tests"]
exclude = "^(src/examples/|tests/fixtures/)"

[[tool.mypy.overrides]]
module = ["mistralai_search_toolkit.*", "fastmcp.*"]
ignore_missing_imports = true
