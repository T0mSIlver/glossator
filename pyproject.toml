[project]
name = "glossator"
version = "0.1.0"
description = "A Mistral Search Toolkit project"
requires-python = ">=3.12,<3.15"
dependencies = [
    # The MCP server (entrypoints/mcp_server.py) routes through
    # glossator.retrieval, so it stays backend-agnostic.
    "fastmcp>=3.3.1",
    "httpx>=0.27",
    # Pinned exactly, and core and the vespa plugin are released in lockstep on the same version
    # number. The `vespa` extra pulls the plugin, whose own dependency on core carries no lower
    # bound -- so a core pin left behind a plugin release resolves to a pair that imports names
    # the older core does not have. Bump both by bumping this.
    "mistralai-search-toolkit[text-splitter-langchain,vespa]==0.0.13",
    "python-dotenv>=0.9.9",
    # Logging in library code (AGENTS.md). Also a toolkit dependency, but we call
    # it directly, so it is declared rather than inherited.
    "structlog>=25.1",
]

[project.optional-dependencies]
workflows = [
    "mistralai-workflows[mistralai]>=3.0.0,<4",
    "pydantic",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML>=6.0",
    # `make test` round-trips a document through the backend; see tests/.
    "pytest>=8.0",
]

[tool.mypy]
# The workflow samples only type-check with the optional `workflows` extra installed,
# and they are template scaffolding rather than part of the engine.
exclude = ["^src/examples/"]

[tool.ruff]
# Ruff reformats the python inside markdown code fences. That rewrites vendored
# skill documentation, and it rewrites corpus fixtures that are supposed to be
# byte-for-byte what the corpus adapter produces (their hashes are in a manifest).
extend-exclude = [".agents", "tests/fixtures"]

[tool.ruff.lint]
ignore = [
    # The toolkit's base classes declare their context parameter as
    # `context: IngestContext = IngestContext()`; an override that does not match
    # that signature is a different method. The contexts are frozen models, so the
    # shared-mutable-default hazard the rule guards against does not apply.
    # The same shape is how the workflows SDK declares an injected dependency
    # (`embedder: MistralEmbedder = Depends(get_embedder)`).
    "B008",
]

[tool.uv]
exclude-newer = "7 days"
# Gemfury (UV_EXTRA_INDEX_URL) may list older versions of mistral-common /
# mistralai-search-toolkit than PyPI. Allow uv to pick the best match across indexes.
index-strategy = "unsafe-best-match"

[tool.uv.exclude-newer-package]
mistralai = false
"mistral-common" = false
"mistralai-search-toolkit" = false
"mistralai-search-toolkit-plugins-vespa" = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entrypoints", "src/glossator", "src/examples"]
