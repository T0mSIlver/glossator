[project]
name = "glossator"
version = "0.1.0"
description = "A Mistral Search Toolkit project"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Shared across backends: the MCP server (entrypoints/mcp_server.py) is
    # backend-agnostic (routes through search_app.get_index) and ships on both.
    "fastmcp>=3.3.1",
    "httpx>=0.27",
    # Pinned exactly, and core and the vespa plugin are released in lockstep on the same version
    # number. The `vespa` extra pulls the plugin, whose own dependency on core carries no lower
    # bound -- so a core pin left behind a plugin release resolves to a pair that imports names
    # the older core does not have. Bump both by bumping this.
    "mistralai-search-toolkit[text-splitter-langchain,vespa]==0.0.13",
    "python-dotenv>=0.9.9",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
workflows = [
    "mistralai-workflows[mistralai]>=3.0.0,<4",
    "pydantic",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    # `make test` round-trips a document through the backend; see tests/.
    "pytest>=8.0",
]

[tool.uv]
exclude-newer = "7 days"
# Gemfury (UV_EXTRA_INDEX_URL) may list older versions of mistral-common /
# mistralai-search-toolkit than PyPI. Allow uv to pick the best match across indexes.
index-strategy = "unsafe-best-match"

[tool.uv.exclude-newer-package]
mistralai = false
"mistral-common" = false
"mistralai-search-toolkit" = false
"mistralai-search-toolkit-plugins-vespa" = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entrypoints", "src/glossator", "src/search_app", "src/examples"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# The starter template's modules predate this configuration and are owned elsewhere.
module = ["entrypoints.*", "search_app.*", "examples.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["mistralai_search_toolkit.*", "fastmcp.*"]
ignore_missing_imports = true
